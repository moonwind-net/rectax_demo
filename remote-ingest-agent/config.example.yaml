# RecTax Remote Ingest Agent configuration
# Copy to config.yaml and adjust paths/limits.

api_base_url: "http://127.0.0.1:8000"
api_prefix: "/api/v1"

# Prefer setting password in .env via RECTAX_AGENT_LOGIN_PASSWORD
login_email: "admin@example.com"
login_password: ""

watch_dirs:
  - "/mnt/remote-invoices"
  - "D:/MountedShare/invoices"

recursive: true
include_patterns:
  - "*.jpg"
  - "*.jpeg"
  - "*.png"
  - "*.pdf"
  - "*.tif"
  - "*.tiff"
  - "*.webp"

scan_interval_seconds: 30
request_timeout_seconds: 60
health_poll_seconds: 5

# Throttle / retry
batch_max_files: 3
batch_max_total_mb: 100
delay_seconds: 2
max_retries: 3
retry_base_seconds: 3

state_file: "./state/agent_state.json"
log_level: "INFO"
